{% extends 'blog/base.html'%}
{% block title%} Add a comment {% endblock title%}
{% block content %}
    {% if comment %}
        <h2>Your comment has been added</h2>
    <p>
        <a href="{{post.get_absolute_url}}">Back to the post</a>
    </p>

    {% else %}
        <!-- you can use with clause in here but becus the context has the same name, we dont have to use with clause -->
        <!-- {% include 'blog/post/include/comment_form.html' with form=form%} -->
        {% include 'blog/post/include/comment_form.html' %}
    {% endif %}
{% endblock content %}
